[tool.poetry]
name = "or-scenario"
version = "0.3.0"
description = "Template framework for Operations Research scenarios"
authors = ["yehemin <yehemin@example.com>"]
readme = "README.md"
packages = [{include = "or_scenario"}]
include = ["or_scenario/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
register = {path = "../register/dist/register-0.1.0-py3-none-any.whl"}
or-algo = {path = "../or-algo/dist/or_algo-0.2.0-py3-none-any.whl"}
data-access-layer = {path = "../data-access-layer/dist/data_access_layer-0.1.0-py3-none-any.whl"}
pydantic = "^2.0"
omni-orm = {path = "../omni-orm/dist/omni_orm-0.1.0-py3-none-any.whl"}
aiofiles = "^25.1.0"
aiosqlite = "^0.22.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
mypy = "^1.10"
pytest-cov = "^7.1.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
