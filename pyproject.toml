[tool.poetry]
name = "or-scenario"
version = "0.3.0"
description = "Template framework for Operations Research scenarios"
authors = ["yehemin <yehemin@example.com>"]
readme = "README.md"
packages = [{include = "or_scenario"}]
include = ["or_scenario/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.13.4"
register = {path = "D:/github/register/dist/register-0.1.0-py3-none-any.whl"}
data-access-layer = {path = "D:/github/data-access-layer/dist/data_access_layer-0.1.0-py3-none-any.whl"}
or-algo = {path = "D:/github/or-algo/dist/or_algo-0.2.0-py3-none-any.whl"}
sqlalchemy = "^2.0.50"
pandas = "^2.0"
openpyxl = "^3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.8"
mypy = "^1.10"
pytest-cov = "^7.1.0"
pandas-stubs = "^2.0"

[tool.ruff]
exclude = ["tests"]
line-length = 100
target-version = "py311"

[tool.mypy]
exclude = ["tests"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*declarative base already contains.*:sqlalchemy.exc.SAWarning"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "mirrors"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"
